<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Profile Maker</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
.card{max-width:400px;margin:auto;background:#1e293b;padding:20px;border-radius:15px}
#preview{width:100%;height:380px;border-radius:15px;background-size:cover;background-position:center;position:relative;overflow:hidden;display:flex;align-items:end;justify-content:center;margin-top:15px}
#userImg{width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid white;display:none}
select,input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;font-size:16px}
button{background:#3b82f6;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>AI Profile Photo Maker</h2>
<input type="file" id="photoInput" accept="image/*">
<select id="country">
<option value="https://images.unsplash.com/photo-1512453979798-5ea266f8880c">Dubai</option>
<option value="https://images.unsplash.com/photo-1497366216548-37526070297c">USA</option>
<option value="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab">UK</option>
<option value="https://images.unsplash.com/photo-1524634126442-357e0eac3c14">Canada</option>
</select>
<div id="preview"><img id="userImg"></div>
<button>Download</button>
</div>
<script>
const photoInput=document.getElementById('photoInput');
const country=document.getElementById('country');
const preview=document.getElementById('preview');
const userImg=document.getElementById('userImg');
preview.style.backgroundImage=`url(${country.value})`;
country.addEventListener('change',()=>{preview.style.backgroundImage=`url(${country.value})`;});
photoInput.addEventListener('change',(e)=>{
userImg.src=URL.createObjectURL(e.target.files[0]);
userImg.style.display='block';
});
</script>
</body>
</html>
